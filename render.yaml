services:
  - type: web
    name: typecat-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false          # You will paste this manually in the Render dashboard
      - key: JWT_SECRET
        sync: false          # You will paste this manually in the Render dashboard
      - key: FRONTEND_URL
        sync: false          # Set to your Vercel URL after deploying frontend
